# Log rotation for the IoT Platform host.
#
# Why this file exists
# --------------------
# The application and its backup jobs run under systemd, and by default everything they
# write goes to the journal. The journal is rotated by journald, which keeps only bounded
# history, and that is how production has been running. Operators who enable file-based
# logging (or who add their own components) need a bounded, predictable rotation policy on
# the application log directory -- without one, an unrotated access/debug log eventually
# fills the same disk that holds the encrypted database backups, which turns a logging
# setting into a data-loss event.
#
# Install as /etc/logrotate.d/iot-platform and validate with:
#   logrotate -d /etc/logrotate.d/iot-platform     # debug/dry run
#   logrotate -f /etc/logrotate.d/iot-platform     # force once, only when intended
#
# What this file does NOT do
# --------------------------
# It never signals the application. iot-platform.service has no log-reopen handler, and a
# restart to "apply rotation" would drop live device connections. See the postrotate note
# below, and see ops/logrotate/README.md for where logs go today.

/var/log/iot-platform/*.log {
    # Runs as the service identity so a rotation never leaves root-owned log files that the
    # application can no longer write to.
    su iot-platform iot-platform
    daily
    # 14 files * daily = two weeks of history on disk, compressed. Adjust `rotate`, not the
    # on-disk growth: unbounded retention is the failure this block exists to prevent.
    rotate 14
    maxsize 200M
    missingok
    notifempty
    compress
    # Delay by one cycle so a log rotated at midnight is still being read uncompressed by
    # an operator (or a log tail) during the current day.
    delaycompress
    dateext
    # copytruncate, not the default rename+signal: the application keeps the file descriptor
    # open and has no SIGHUP reopen support, so renaming the file would send every subsequent
    # log line to the rotated inode and the active log would silently stop growing. The cost
    # of copytruncate is a small window in which a write can be lost during the copy; that
    # trade is documented and accepted here because the alternative loses all future lines.
    # If the application ever grows a reopen handler, switch to postrotate signalling and
    # drop this directive.
    copytruncate
    sharedscripts
    postrotate
        # Deliberately does NOT touch the service. No `systemctl restart`, no `systemctl
        # kill`, no signal: rotating a file is not a reason to interrupt device traffic.
        #
        # journald owns journal file rotation (SystemMaxUse etc. in /etc/systemd/journald.conf),
        # so the only journal-side action here is a bounded vacuum of records older than the
        # same 14-day retention this file applies to application logs.
        /usr/bin/journalctl --vacuum-time=14d --vacuum-size=1G >/dev/null 2>&1 || true
    endscript
}
