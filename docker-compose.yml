# DEVELOPMENT ONLY: this compose starts EMQX transport. It does not by itself
# configure platform HTTP auth/ACL or telemetry/ACK webhooks.
# See docs/RESCUE-02-RUNTIME-RUNBOOK.md before any production use.
services:
  emqx:
    image: emqx/emqx:5.9.2
    container_name: emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "8883:8883"
      - "18083:18083"
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=127.0.0.1
    restart: always
