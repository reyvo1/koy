name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iot_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iot_platform
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iot_platform
      REDIS_URL: redis://localhost:6379
      DATABASE_INTEGRATION_TESTS_ALLOWED: 'true'
      MQTT_INTEGRATION_TESTS_ALLOWED: 'true'
      NODE_ENV: test
      LOG_LEVEL: silent
      TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}
          restore-keys: |
            prisma-${{ runner.os }}-${{ runner.arch }}-

      - name: Bootstrap dependencies
        timeout-minutes: 10
        run: bash ops/scripts/ci-bootstrap-dependencies.sh

      - name: Verify gate verifier self-tests
        # These are the self-tests for the verifiers this job itself runs. A `:verify`
        # gate can only catch a regression if its own `:self-test` is green, and none of
        # these were referenced by any workflow, so a broken verifier would have gone
        # unnoticed until it silently stopped catching anything.
        run: |
          npm run security:stack:self-test
          npm run security:web-stack:self-test
          npm run fastify:v5:compat:self-test
          npm run web:framework:contract:self-test
          npm run wave1:prepush:self-test
          npm run wave2:prisma:self-test
          npm run gitignore:source-scope:self-test
          npm run uat:seed:env:self-test
          npm run rescue:unit-types:self-test
          npm run rescue:unit-regressions:self-test
          npm run rescue:acceptance:self-test
          npm run rescue:dashboard-integration:self-test
          npm run rescue:emqx:webhooks:self-test
          npm run rescue:failure-summary:self-test
          npm run rescue:local:self-test
          npm run rescue:runtime:self-test
          npm run rescue:gate1-validator:self-test
          npm run release:approval:self-test

      - name: Verify Wave 2 core runtime contract
        run: npm run wave2:core-runtime:self-test

      - name: Verify secure NestJS/Fastify dependency boundary
        run: npm run security:stack:verify

      - name: Verify secure Next.js dependency boundary
        run: npm run security:web-stack:verify

      - name: Production dependency audit policy
        run: npm run security:audit:production

      - name: Non-mutating lint
        run: npm run lint:check

      - name: Validate deployment shell scripts
        run: bash -n ops/scripts/*.sh

      - name: Validate Prisma schema
        run: node node_modules/prisma/build/index.js validate
      - name: Run Prisma migrations
        run: node node_modules/prisma/build/index.js migrate deploy

      - name: Self-test baseline build-artifact hygiene
        run: npm run baseline:hygiene:self-test

      - name: Verify Fastify v5 source compatibility
        run: npm run fastify:v5:compat:verify

      - name: Build backend
        run: npm run build

      - name: Verify web framework contract/documentation sync
        run: npm run web:framework:contract:verify

      - name: Type-check web workspaces
        run: npm run web:typecheck

      - name: Build web workspaces
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_ENV: production
        run: npm run web:build

      - name: Test
        run: npm test -- --runInBand

      - name: E2E smoke test
        run: npm run test:e2e

      - name: Database integration test (includes Wave 2 runtime evidence)
        run: npm run test:integration:db

      - name: MQTT workflow integration test
        run: npm run test:integration:mqtt

      - name: MQTT production publisher TLS integration test
        run: npm run test:integration:mqtt:publisher

      - name: PostgreSQL recovery drill
        env:
          RECOVERY_DRILL_TESTS_ALLOWED: 'true'
        run: npm run test:recovery

      - name: Test coverage
        run: npm run test:cov

      - name: Build production release artifact
        run: npm run release:build

      - name: Verify production release artifact
        run: npm run release:verify

      - name: Production artifact startup smoke
        run: npm run test:startup:production

      - name: Upload production release artifact
        uses: actions/upload-artifact@v4
        with:
          name: iot-platform-${{ github.sha }}
          path: artifacts/iot-platform-release
          if-no-files-found: error
          retention-days: 14


  esp32-firmware-simulation:
    name: Wave 3 ESP-IDF ${{ matrix.target }} build and QEMU boot
    # Run both chip targets in parallel with core CI. This makes native firmware
    # failures visible early instead of serializing ESP32 -> QEMU -> ESP32-C3.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c3]
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify Wave 3 firmware/build-graph contract before toolchain install
        run: |
          node scripts/self-test-wave3-esp32-simulation.mjs
          node scripts/self-test-wave3-esp-idf-build-graph.mjs
          node scripts/self-test-wave3-esp-idf-api-surface.mjs
          node scripts/self-test-wave3-esp-idf-toolchain-lifecycle.mjs
          node scripts/self-test-wave3-qemu-boot-runner.mjs
          node scripts/self-test-wave3-esp32-source.mjs

      - name: Install ESP-IDF 5.5.5
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5

      - name: Build ${{ matrix.target }} firmware with real ESP-IDF toolchain
        working-directory: packages/esp32-sdk/test-app
        run: |
          rm -rf build sdkconfig sdkconfig.old
          idf.py set-target "${{ matrix.target }}"
          idf.py build

      - name: Install target QEMU without reactivating ESP-IDF
        run: |
          sudo apt-get update
          sudo apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          if [ "${{ matrix.target }}" = "esp32c3" ]; then
            QEMU_TOOL=qemu-riscv32
            QEMU_BINARY=qemu-system-riscv32
          else
            QEMU_TOOL=qemu-xtensa
            QEMU_BINARY=qemu-system-xtensa
          fi
          IDF_PYTHON="$IDF_PYTHON_ENV_PATH/bin/python"
          test -x "$IDF_PYTHON"
          "$IDF_PYTHON" "$IDF_PATH/tools/idf_tools.py" install "$QEMU_TOOL"
          QEMU_PATH="$(find "$IDF_TOOLS_PATH/tools/$QEMU_TOOL" \( -type f -o -type l \) -name "$QEMU_BINARY" -print -quit)"
          test -n "$QEMU_PATH"
          QEMU_DIR="$(dirname "$QEMU_PATH")"
          export PATH="$QEMU_DIR:$PATH"
          echo "$QEMU_DIR" >> "$GITHUB_PATH"
          "$QEMU_PATH" --version

      - name: Boot ${{ matrix.target }} linked SDK firmware in Espressif QEMU
        run: |
          idf.py --version
          node scripts/run-wave3-qemu-boot.mjs \
            --target="${{ matrix.target }}" \
            --app-path=packages/esp32-sdk/test-app \
            --timeout-ms=30000

      - name: Stage exact ESP32 firmware artifact for live-service simulation
        if: matrix.target == 'esp32'
        run: |
          mkdir -p artifacts/wave3-esp32
          cp packages/esp32-sdk/test-app/build/iot_sdk_wave3_test_app.bin artifacts/wave3-esp32/
          cp packages/esp32-sdk/test-app/build/iot_sdk_wave3_test_app.elf artifacts/wave3-esp32/
          cp packages/esp32-sdk/test-app/build/flasher_args.json artifacts/wave3-esp32/
          test "$(od -An -tx1 -N1 artifacts/wave3-esp32/iot_sdk_wave3_test_app.bin | tr -d ' \n')" = "e9"
          (cd artifacts/wave3-esp32 && sha256sum iot_sdk_wave3_test_app.bin > sha256.txt)
          cat artifacts/wave3-esp32/sha256.txt

      - name: Optional Wokwi hardware simulation
        if: matrix.target == 'esp32' && env.WOKWI_CLI_TOKEN != ''
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ env.WOKWI_CLI_TOKEN }}
          path: packages/esp32-sdk/test-app
          expect_text: 'WAVE3_OTA_SHA256_REQUIRED'

      - name: Record Wokwi evidence boundary when token is absent
        if: matrix.target == 'esp32' && env.WOKWI_CLI_TOKEN == ''
        run: echo 'Wokwi NOT_RUN_EXTERNAL_TOKEN; mandatory ESP-IDF/QEMU matrix evidence remains required and Wokwi PASS is not claimed.'

      - name: Upload Wave 3 firmware artifact
        if: matrix.target == 'esp32'
        uses: actions/upload-artifact@v4
        with:
          name: wave3-esp32-firmware
          path: artifacts/wave3-esp32/
          if-no-files-found: error
          retention-days: 14


  rescue-live-emqx:
    name: Rescue live EMQX / acceptance
    needs: [test, esp32-firmware-simulation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_INTEGRATION_TESTS_ALLOWED: 'true'
      MQTT_INTEGRATION_TESTS_ALLOWED: 'true'
      TEST_RUN_ID: rescue-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: rescue-prisma-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}
          restore-keys: |
            rescue-prisma-${{ runner.os }}-${{ runner.arch }}-

      - name: Bootstrap dependencies
        timeout-minutes: 10
        run: bash ops/scripts/ci-bootstrap-dependencies.sh

      - name: Verify sealed source and CI contract
        run: |
          npm run baseline:manifest:self-test
          npm run baseline:manifest:verify
          npm run rescue:validate
          npm run wave2:core-runtime:self-test
          npm run wave3:esp32:self-test
          npm run rescue:github-ci:self-test

      - name: Download exact Wave 3 firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: wave3-esp32-firmware
          path: artifacts/wave3-esp32

      - name: Verify Wave 3 firmware artifact hash
        run: (cd artifacts/wave3-esp32 && sha256sum -c sha256.txt)

      - name: Verify Docker Compose runtime
        run: |
          docker version
          docker compose version
          df -h .

      - name: Generate ephemeral rescue environment
        run: npm run rescue:env:init -- --output=.env

      - name: Bring up source-bound rescue runtime
        timeout-minutes: 15
        run: npm run rescue:local:up -- --env=.env --timeout-ms=300000

      - name: Confirm live rescue endpoint
        run: npm run rescue:local:status -- --env=.env

      - name: Targeted PostgreSQL integration stability gate
        timeout-minutes: 8
        run: npm run test:integration:db

      - name: Self-test bounded live broker smoke operations
        run: npm run rescue:broker:smoke:self-test

      - name: Real EMQX auth ACL webhook and ACK smoke
        timeout-minutes: 8
        run: npm run rescue:broker:smoke -- --env=.env

      - name: Wave 3 simulated ESP32 provisioning reconnect command and OTA
        timeout-minutes: 10
        run: npm run wave3:esp32:simulate -- --env=.env --firmware=artifacts/wave3-esp32/iot_sdk_wave3_test_app.bin

      - name: Seed the UAT baseline
        timeout-minutes: 10
        # The Wave 9 camera and location probes authenticate as the seeded UAT admin, and a fresh CI
        # database has no users. Added only once it was observed failing: the steps below returned
        # `UAT login failed: HTTP 401` on a clean runner, which is indistinguishable from a broken
        # login path and would have been read as a regression in the probes themselves.
        run: npm run uat:seed

      - name: Wave 9 media runtime RTSP to WebRTC
        timeout-minutes: 10
        run: npm run media:probe

      - name: Wave 9 camera onboarding and device location
        timeout-minutes: 10
        run: |
          npm run camera:probe
          npm run location:probe

      - name: Wave 10 telemetry retention and rollups
        timeout-minutes: 10
        # The only gate for this one. The unit suite runs against a fake Prisma, so it cannot see that
        # jsonb_each_text yields text and PostgreSQL has no sum(text) -- that regression stayed green
        # under mutation until the live probe failed. Run it against the real database.
        run: |
          npm run retention:probe

      - name: Wave 13 load gate
        timeout-minutes: 10
        # Measures the LIVE rescue API with autocannon and holds it to config/performance-budget.json.
        # Deliberately not skipped when the target is down: a load gate that quietly passes on an
        # unreachable API would manufacture performance evidence out of nothing.
        env:
          LOAD_TARGET_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run load:gate

      - name: Wave 12 cross-region operations
        timeout-minutes: 10
        # The only gate for the completeness claim. Only a real join across findings -> devices -> regions
        # can show that an unplaced device makes the rollup report itself incomplete instead of quietly
        # shrinking the fleet.
        run: |
          npm run crossregion:probe

      - name: Wave 12 device twin
        timeout-minutes: 10
        # The only gate for STALE and DIVERGENT as real verdicts. A mocked suite can assert a branch was
        # taken; only a real aged observation and a real disagreeing payload prove the twin refuses to call
        # them agreement.
        run: |
          npm run twin:probe

      - name: Wave 12 edge gateway
        timeout-minutes: 10
        # The only gate for the allowlist filter. A mocked suite passes even with `where` dropped from the
        # gateway's device query, because a mock returns whatever it is told; only a real database shows that
        # a gateway registered for one device genuinely cannot deliver for another.
        run: |
          npm run edge:probe

      - name: Wave 12 region boundaries
        timeout-minutes: 10
        # Also the only gate for the regions table, its seeded row, and the foreign key on devices.regionId.
        # A fake Prisma cannot show that the migration created them, nor that the seeded region is the one
        # this platform actually runs in.
        run: |
          npm run region:probe

      - name: Wave 11 energy intelligence
        timeout-minutes: 10
        # Reads the Wave 10 rollups through a tenant-scoped join. A fake Prisma cannot show that the join
        # actually returns only this tenant's capabilities in a real database, nor that two rollup buckets on
        # different days land in different periods.
        run: |
          npm run energy:probe

      - name: Wave 11 maintenance risk forecasting
        timeout-minutes: 10
        # Also the only gate for the DeviceRisk enum and the four risk columns. The unit suite drives a fake
        # Prisma, so it cannot show that the enum accepts NOT_ESTABLISHED or that the two forecast windows
        # really are disjoint rows in a real table.
        run: |
          npm run risk:probe

      - name: Wave 11 device health scoring
        timeout-minutes: 10
        # The migration adds a Postgres enum and four columns that a fake Prisma knows nothing about, so
        # the schema half of this slice is only proven by the real database.
        run: |
          npm run health:probe

      - name: Wave 11 anomaly detection
        timeout-minutes: 10
        # Also the only gate for the SQL and the enum writes. The unit suite drives a fake Prisma, so it
        # cannot show that a finding row is accepted by the real schema, or that `evidenceTelemetryId`
        # resolves back to a telemetry row. Run it against the real database.
        run: |
          npm run anomaly:probe

      - name: Gate 1 source-bound runtime receipt
        run: |
          npm run rescue:gate1
          npm run rescue:gate1:validate

      - name: Full automated acceptance once
        timeout-minutes: 20
        run: npm run rescue:acceptance -- --env=.env --full

      - name: Capture rescue diagnostics
        if: always()
        run: |
          mkdir -p reports/github-ci
          docker compose -f docker-compose.rescue.yml ps -a > reports/github-ci/docker-compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.rescue.yml logs --no-color > reports/github-ci/docker-compose.log 2>&1 || true
          docker system df > reports/github-ci/docker-system-df.txt 2>&1 || true
          df -h . > reports/github-ci/disk-usage.txt 2>&1 || true

      - name: Upload rescue reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-live-emqx-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down ephemeral rescue runtime
        if: always()
        run: docker compose -f docker-compose.rescue.yml down --volumes --remove-orphans || true
